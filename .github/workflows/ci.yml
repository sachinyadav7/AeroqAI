name: AeroqAI CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-quality-gate:
    name: Unit Tests & Quality Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Pytest Suite Across All Modules
        run: |
          python -m pytest tests/ -v

      - name: Run Automated Quality Release Gate
        run: |
          python run_quality_gate.py --report benchmark_results.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build React Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

